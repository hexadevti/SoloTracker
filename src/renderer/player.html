<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src 'self';" />
  <title></title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  </style>
</head>
<body>
  <!-- Player do modo offline. O preload (ponte) controla este <video> como faz com o do YouTube. -->
  <video id="v" autoplay playsinline preload="auto"></video>
  <script src="player.js"></script>
</body>
</html>
